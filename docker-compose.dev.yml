name: livem
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: livem
      POSTGRES_PASSWORD: livem
      POSTGRES_DB: livem
    ports:
      - "55439:5432"
    volumes:
      - livem-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livem"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  livem-dev-data:
